name: Release
run-name: Release ${{ inputs.version || github.ref_name }}

on:
  # Actions > Release > Run workflow, on main: the workflow creates the tag of the version.
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, such as 0.2.0. CHANGELOG.md must have a section for it.
        required: true
        type: string
  # Pushing a tag v* on a commit of main does the same.
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  publish:
    name: Publish to NuGet
    runs-on: ubuntu-latest
    # Protection rules on this environment, such as a required reviewer, gate every publication.
    environment: nuget
    permissions:
      # Creates the tag and the GitHub release.
      contents: write
      # Trusted Publishing: the OIDC token of the run is exchanged for a short-lived NuGet API key.
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # MinVer computes the version from the Git tags and history.
          fetch-depth: 0

      # The version typed when the workflow is run by hand, or the version of the pushed tag.
      - name: Resolve the version
        env:
          REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          version="${REQUESTED#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::The version must look like 0.2.0, or 0.2.0-beta.1 for a pre-release."
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "TAG=v$version" >> "$GITHUB_ENV"

      # Everything that can fail is checked before anything is published.
      - name: Check the commit, the tag and the configuration
        env:
          GH_TOKEN: ${{ github.token }}
          NUGET_USER: ${{ vars.NUGET_USER }}
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Releases are made from main: run the workflow on main, or push the tag on a commit of main."
            exit 1
          fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "::error::$TAG is already released: add a section for the next version to CHANGELOG.md."
            exit 1
          fi
          if git rev-parse --quiet --verify "refs/tags/$TAG" > /dev/null; then
            if [ "$(git rev-parse "$TAG^{commit}")" != "$(git rev-parse HEAD)" ]; then
              echo "::error::$TAG already exists on another commit."
              exit 1
            fi
          else
            # Run by hand: tag the commit here for MinVer; the release creates the tag on GitHub.
            git tag "$TAG"
          fi
          if [ -z "$NUGET_USER" ]; then
            echo "::error::Set the NUGET_USER repository variable to the nuget.org account that owns the package."
            exit 1
          fi

      - name: Extract the release notes from the changelog
        run: |
          # The section of the version, up to the next version or to the link definitions.
          awk -v heading="## [$VERSION]" '
            /^## \[/ { if (found) exit; found = index($0, heading) == 1; next }
            /^\[[^]]+\]: / { if (found) exit }
            found
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md has no section for $VERSION."
            exit 1
          fi

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build

      - name: Pack
        run: dotnet pack src/Hubertech.Belgium --configuration Release --no-build --output artifacts/packages

      # A tag MinVer does not read as a version would produce a pre-release of 0.0.0.
      - name: Check the package version
        run: |
          package="artifacts/packages/Hubertech.Belgium.$VERSION.nupkg"
          if [ ! -f "$package" ]; then
            echo "::error::$package was not produced. Packages found:"
            ls artifacts/packages
            exit 1
          fi

      - name: Log in to NuGet
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      # The symbol package next to it is pushed too.
      - name: Push to NuGet
        run: >-
          dotnet nuget push "artifacts/packages/*.nupkg"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      # Creates the tag on GitHub when it does not exist yet. --target is required: without it, gh
      # refuses a tag that exists only locally, as the one created for MinVer does. It also keeps
      # the released commit if main has moved since the run started.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          if [[ "$VERSION" == *-* ]]; then
            prerelease="--prerelease"
          fi
          gh release create "$TAG" artifacts/packages/* \
            --target "$(git rev-parse HEAD)" \
            --title "$TAG" \
            --notes-file release-notes.md \
            $prerelease
