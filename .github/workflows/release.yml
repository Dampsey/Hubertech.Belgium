name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  publish:
    name: Publish to NuGet
    runs-on: ubuntu-latest
    # Protection rules on this environment, such as a required reviewer, gate every publication.
    environment: nuget
    permissions:
      # Creates the GitHub release.
      contents: write
      # Trusted Publishing: the OIDC token of the run is exchanged for a short-lived NuGet API key.
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # MinVer computes the version from the Git tags and history.
          fetch-depth: 0

      # Everything that can fail is checked before anything is published.
      - name: Check the tag and the configuration
        env:
          NUGET_USER: ${{ vars.NUGET_USER }}
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME is not on main: tags are only created on main, after CI is green."
            exit 1
          fi
          if [ -z "$NUGET_USER" ]; then
            echo "::error::Set the NUGET_USER repository variable to the nuget.org account that owns the package."
            exit 1
          fi

      - name: Extract the release notes from the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          # The section of the version, up to the next version or to the link definitions.
          awk -v heading="## [$version]" '
            /^## \[/ { if (found) exit; found = index($0, heading) == 1; next }
            /^\[[^]]+\]: / { if (found) exit }
            found
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md has no section for $version."
            exit 1
          fi

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build

      - name: Pack
        run: dotnet pack src/Hubertech.Belgium --configuration Release --no-build --output artifacts/packages

      # A tag MinVer does not read as a version would produce a pre-release of 0.0.0.
      - name: Check the package version
        run: |
          package="artifacts/packages/Hubertech.Belgium.${GITHUB_REF_NAME#v}.nupkg"
          if [ ! -f "$package" ]; then
            echo "::error::$package was not produced. Packages found:"
            ls artifacts/packages
            exit 1
          fi

      - name: Log in to NuGet
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      # The symbol package next to it is pushed too.
      - name: Push to NuGet
        run: >-
          dotnet nuget push "artifacts/packages/*.nupkg"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            prerelease="--prerelease"
          fi
          gh release create "$GITHUB_REF_NAME" artifacts/packages/* \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            $prerelease
